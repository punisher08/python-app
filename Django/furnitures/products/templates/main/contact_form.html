{% load static %}
<style>
    .contact h1 {
        width: 100%;
        font-size: 40px;
        color: #1c1c1c;
        font-weight: bold;
        text-align: center;
        padding-top: 40px;
    }

    .contact p ,
    .contact label {
        font-size: 16px;
        color: #1c1c1c !important;
    }

    .contact button {
        width: 100%;
        font-size: 18px;
        color: #ffffff;
        background-color: #000;
        padding: 8px 5px;
        text-align: center;
        font-weight: bold;
        border: none;
    }

    .contact button:hover {
        color: #000;
        background-color: #fff;
        border: 1px solid #000;
    }

    .contact input:focus,
    .contact textarea:focus {
        border: 1px solid #000 !important;
    }
</style>
<form class="p-4 border rounded shadow-sm bg-light" style="max-width: 700px; margin: auto;">
    <div class="text-center mb-4">
        <h1 class="h3 fw-900">Interested? Let's Talk</h1>
        <p class="text-muted m-0 p-0">We’d love to hear from you.</p>
    </div>

    <!-- Full Name -->
    <div class="form-floating mb-3">
        <label for="fullName">Full Name</label>
        <input type="text" class="form-control" id="fullName" placeholder="Juan" required>
    </div>

    <!-- Contact Number -->
    <div class="form-floating mb-3">
        <label for="contactNumber">Contact Number</label>
        <input type="tel" class="form-control" id="contactNumber" placeholder="09123456789" required>
    </div>

    <!-- Message -->
    <div class="form-floating mb-3">
        <label for="message">Message</label>
        <textarea class="form-control" placeholder="Leave a message here" id="message" style="height: 120px"
            required></textarea>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary w-100 py-2" type="submit">Send Message</button>
</form>
